name: Fetch generated logo assets
on:
  push:
    branches:
      - claude/salisbury-vet-clinic-logo-6sd81c

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/salisbury-vet-clinic-logo-6sd81c
      - name: Download generated logo images
        run: |
          mkdir -p assets
          curl -fsSL -o assets/silhouette_candidate_a.png "https://d8j0ntlcm91z4.cloudfront.net/user_3DJex4AabX8CYKots03e5DPjGfy/hf_20260706_222212_bdc5b9d9-e062-4a5f-9522-4fa21762c4e0.png"
          curl -fsSL -o assets/silhouette_candidate_b.png "https://d8j0ntlcm91z4.cloudfront.net/user_3DJex4AabX8CYKots03e5DPjGfy/hf_20260706_222212_c960aa7c-eaa8-4382-b762-4d0243cb016e.png"
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || {
            git commit -m "Add silhouette logo candidate images"
            git push origin claude/salisbury-vet-clinic-logo-6sd81c
          }
