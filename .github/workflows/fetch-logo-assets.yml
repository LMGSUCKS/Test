name: Fetch generated logo assets
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/salisbury-vet-clinic-logo-6sd81c
      - name: Download generated logo images
        run: |
          mkdir -p assets
          curl -fsSL -o assets/logo_candidate_a.png "https://d8j0ntlcm91z4.cloudfront.net/user_3DJex4AabX8CYKots03e5DPjGfy/hf_20260706_221044_c4fd54dd-482a-459b-908d-b4a9bb62b007.png"
          curl -fsSL -o assets/logo_candidate_b.png "https://d8j0ntlcm91z4.cloudfront.net/user_3DJex4AabX8CYKots03e5DPjGfy/hf_20260706_221044_916e395a-ee15-42dc-8b15-b067633c9ce4.png"
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "Add generated logo candidate images"
          git push origin claude/salisbury-vet-clinic-logo-6sd81c
